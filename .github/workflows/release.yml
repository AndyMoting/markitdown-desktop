name: Build and Release

on:
  push:
    tags: ['v*']           # way 1: git tag v13.0.0 && git push origin v13.0.0
  workflow_dispatch:       # way 2: click button in GitHub Actions page
    inputs:
      version:
        description: 'Version number (e.g. 13)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup UPX
        run: |
          $upxVersion = "4.2.4"
          $upxZip = "upx-$upxVersion-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v$upxVersion/$upxZip" -OutFile "$env:RUNNER_TEMP\$upxZip"
          Expand-Archive -Path "$env:RUNNER_TEMP\$upxZip" -DestinationPath "$env:RUNNER_TEMP\upx"
          $upxDir = Get-ChildItem "$env:RUNNER_TEMP\upx" -Directory | Select-Object -First 1
          echo "$($upxDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "latest" }
          powershell -File build.ps1 -Version $ver -SkipZip -NoPause

      - name: Package ZIP
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Compress-Archive -Path dist\InkDrop\* -DestinationPath InkDrop.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InkDrop.zip
          generate_release_notes: true
